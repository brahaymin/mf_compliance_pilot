<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Rules — MF Feedback Pilot</title>
  <link rel="canonical" href="index.html">
  <script>
    (function () {
      window.location.replace("index.html" + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>The rule sample now lives on the main <a id="rules-redirect" href="index.html">Rules</a> page.</p>
  <script>
    document.getElementById("rules-redirect").href = "index.html" + window.location.search + window.location.hash;
  </script>
</body>
</html>
