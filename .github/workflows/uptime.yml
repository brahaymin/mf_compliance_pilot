name: uptime

on:
  schedule:
    - cron: "17 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check live pages
        run: python scripts/uptime_check.py
